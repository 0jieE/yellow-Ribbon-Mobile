# Builds the three apps for a version tag, attaches the APKs to a GitHub
# release, and tells the backend about them so the apps offer the update.
#
# To release:  scripts/bump-version.sh 1.0.2   (bumps all three pubspecs)
#              commit, then:  git tag -a v1.0.2 -m "What changed"
#                             git push origin main v1.0.2
# The tag message becomes the release notes shown in the update dialog.
#
# Repository secrets used:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD, MAPS_API_KEY, APP_RELEASE_PUBLISH_TOKEN
name: Release apps

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.8"
  PUBLISH_URL: https://yellow-ribbon-backend.onrender.com/api/app-releases/publish/

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - app: customer
            dir: customer_app
            asset: YellowRibbon
          - app: rider
            dir: rider_app
            asset: RibbonRider
          - app: admin
            dir: admin_app
            asset: RibbonAdmin
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD MAPS_API_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Read version
        id: version
        run: |
          line=$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}' | tr -d '\r')
          version="${line%%+*}"
          code="${line#*+}"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error file=${{ matrix.dir }}/pubspec.yaml::version is $version but the tag is $GITHUB_REF_NAME. Run scripts/bump-version.sh $tag first."
            exit 1
          fi
          if ! [[ "$code" =~ ^[0-9]+$ ]] || [ "$line" = "$version" ]; then
            echo "::error file=${{ matrix.dir }}/pubspec.yaml::version needs a +N build number, e.g. $version+2"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - run: flutter pub get

      - run: flutter test

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        # 32- and 64-bit ARM only: every real phone, without the x86_64
        # emulator code that would add about a third to the download.
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: Name, verify and describe the APK
        env:
          APP: ${{ matrix.app }}
          ASSET: ${{ matrix.asset }}
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          file="$ASSET-$VERSION.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/dist/$file"
          cd "$GITHUB_WORKSPACE/dist"

          # Only an APK signed with the release key can install over the apps
          # already on phones. The APKs carry v2/v3 signatures only, which
          # keytool cannot read, so apksigner does the checking.
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          actual=$("$apksigner" verify --print-certs "$file" \
            | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          expected=$(keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" \
            | grep -m1 'SHA256:' | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo "::error::$file is not signed with the release key (got '${actual:-none}')"
            exit 1
          fi
          echo "Signed with the release key: $actual"

          size=$(stat -c %s "$file")
          sha=$(sha256sum "$file" | cut -d' ' -f1)
          jq -n --arg app "$APP" --arg version "$VERSION" --arg code "$CODE" \
                --arg file "$file" --arg size "$size" --arg sha "$sha" \
            '{app: $app, version: $version, version_code: ($code | tonumber),
              file: $file, size: ($size | tonumber), sha256: $sha}' > "$ASSET.json"
          cat "$ASSET.json"

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.app }}
          path: dist/
          retention-days: 7

  release:
    name: Release and publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          path: dist
          merge-multiple: true

      - name: Release notes from the tag message
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/-----BEGIN PGP SIGNATURE-----/,$d' > notes.md
          [ -s notes.md ] || echo "Yellow Ribbon $GITHUB_REF_NAME" > notes.md
          cat notes.md

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.apk \
              --title "Yellow Ribbon $GITHUB_REF_NAME" --notes-file notes.md
          fi

      - name: Publish to the backend
        env:
          GH_TOKEN: ${{ github.token }}
          TOKEN: ${{ secrets.APP_RELEASE_PUBLISH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Missing repository secret APP_RELEASE_PUBLISH_TOKEN"
            exit 1
          fi
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets)
          failed=0

          for meta in dist/*.json; do
            file=$(jq -r .file "$meta")
            url=$(echo "$assets" | jq -r --arg f "$file" '.assets[] | select(.name == $f) | .url')
            if [ -z "$url" ]; then
              echo "::error::$file is not attached to the release"
              failed=1
              continue
            fi
            body=$(jq --arg url "$url" --rawfile notes notes.md \
              '{app, version, version_code, size, sha256,
                download_url: $url, notes: ($notes | rtrimstr("\n") | .[0:2000])}' "$meta")

            # Render's free instance sleeps; the first request can take ~50 s.
            # Retry only when the server did not answer or answered 5xx.
            status=000
            for attempt in 1 2 3 4; do
              rm -f response.json
              # curl prints 000 itself when it gets no answer.
              status=$(curl -sS -o response.json -w '%{http_code}' --max-time 120 \
                -X POST "$PUBLISH_URL" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                -d "$body") || true
              [ -n "$status" ] || status=000
              case "$status" in
                000|5??) echo "Attempt $attempt: HTTP $status, retrying"; sleep 15 ;;
                *) break ;;
              esac
            done

            echo "$(jq -r .app "$meta") -> HTTP $status"
            cat response.json 2>/dev/null; echo
            if [ "$status" != "200" ]; then
              echo "::error::Publishing $file failed with HTTP $status"
              failed=1
            fi
          done

          exit $failed
